# Local backend stack (SPEC-02). Loopback-only ports, exact image tags, no secrets.
name: t2f

services:
  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: t2f
      # Loopback-only port and no committed password (NFR-3).
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - t2f_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U t2f']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ['redis-server', '--databases', '64', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    restart: unless-stopped
    command: centrifugo
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      CENTRIFUGO_HTTP_API_INSECURE: 'true'
      CENTRIFUGO_ADMIN_ENABLED: 'false'
      CENTRIFUGO_HEALTH_ENABLED: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/health']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8025/livez']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  t2f_pgdata:
