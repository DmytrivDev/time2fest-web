# Local backend stack (SPEC-02). Loopback-only ports, exact image tags, no secrets.
name: t2f

services:
  postgres:
    image: postgres:17.12-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: t2f
      # Loopback-only port and no committed password (NFR-3).
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - t2f_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U t2f']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ['redis-server', '--databases', '64', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

  centrifugo:
    image: centrifugo/centrifugo:v6.10.3
    restart: unless-stopped
    command: centrifugo
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"chat","allow_subscribe_for_anonymous":true,"allow_subscribe_for_client":true,"force_recovery":true,"history_size":100,"history_ttl":"300s"},{"name":"live","allow_subscribe_for_anonymous":true,"allow_subscribe_for_client":true,"force_recovery":true,"history_size":10,"history_ttl":"300s","presence":true},{"name":"notif","allow_user_limited_channels":true,"force_recovery":true,"history_meta_ttl":"3600s","history_size":20,"history_ttl":"600s"},{"name":"orders","allow_user_limited_channels":true,"force_recovery":true,"history_meta_ttl":"3600s","history_size":20,"history_ttl":"600s"},{"name":"rttest","allow_subscribe_for_anonymous":true,"allow_subscribe_for_client":true,"force_recovery":true,"history_size":50,"history_ttl":"120s"},{"name":"site","allow_subscribe_for_anonymous":true,"allow_subscribe_for_client":true,"force_recovery":true,"history_size":10,"history_ttl":"300s"},{"name":"user","allow_user_limited_channels":true,"force_recovery":true,"history_meta_ttl":"3600s","history_size":20,"history_ttl":"600s"}]'
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_ALLOW_SUBSCRIBE_FOR_ANONYMOUS: 'true'
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_ALLOW_SUBSCRIBE_FOR_CLIENT: 'true'
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_FORCE_RECOVERY: 'true'
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_SIZE: '20'
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_TTL: '300s'
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: 'http://127.0.0.1:* http://localhost:*'
      CENTRIFUGO_CLIENT_ALLOW_ANONYMOUS_CONNECT_WITHOUT_TOKEN: 'true'
      CENTRIFUGO_CLIENT_DISALLOW_ANONYMOUS_CONNECTION_TOKENS: 'true'
      CENTRIFUGO_CLIENT_PING_INTERVAL: '25s'
      CENTRIFUGO_ENGINE_TYPE: 'redis'
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: 'redis://redis:6379/63'
      CENTRIFUGO_ENGINE_REDIS_PREFIX: 't2f_centrifugo'
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: '${T2F_CENTRIFUGO_TOKEN_SECRET:-}'
      CENTRIFUGO_HTTP_API_KEY: '${T2F_CENTRIFUGO_API_KEY:-}'
      CENTRIFUGO_ADMIN_ENABLED: 'false'
      CENTRIFUGO_HEALTH_ENABLED: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8000/health']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8025/livez']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

  r2:
    image: adobe/s3mock:5.2.3
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: t2f-catalog
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=60 -Xss512k'
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  t2f_pgdata:
