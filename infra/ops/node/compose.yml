# Вузол репетиції: Postgres + Redis + Centrifugo + сервер + cloudflared (SPEC-13a, W10; Centrifugo — SPEC-06/07).
# Без `name:` — проєкт задає `-p` (t2f-node-<env>). Без `ports:` — Docker
# обходить ufw, тому назовні нічого не публікується; вхід лише через тунель.
# Файли `server.env`, `postgres.env`, `redis.env`, `cloudflared.env`, `centrifugo.env` лежать поруч на вузлі.
# REDIS_URL, REDIS_PASSWORD, T2F_REDIS_PREFIX, DATABASE_URI, POSTGRES_USER, POSTGRES_DB пише
# `edge-secret --generate` у env-файли; T2F_COMMIT запечено в образ.
services:
  postgres:
    # postgres:17.12-alpine (індексний дайджест, linux/amd64 + arm64)
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    env_file: postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    networks:
      - backend

  redis:
    # redis:7.4.12-alpine (індексний дайджест, linux/amd64 + arm64)
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    env_file: redis.env
    # Пароль (S1) — з redis.env у файл налаштувань контейнера, не в argv процесу; без пароля Redis не стартує.
    # Далі — штатний docker-entrypoint.sh образу (власник /data, перехід на користувача redis).
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$REDIS_PASSWORD" ] || { echo 'redis: empty password in redis.env' >&2; exit 1; }
        umask 077
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
    healthcheck:
      # REDISCLI_AUTH — із змінної контейнера: у `docker inspect` видно лише її ім'я.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    networks:
      - backend

  centrifugo:
    # centrifugo/centrifugo:v6.10.3 (індексний дайджест, linux/amd64 + arm64) — та сама версія, що в docker-compose.yml
    image: centrifugo/centrifugo:v6.10.3@sha256:33fdbbce7d195dde316cbde17bc1d2a17b9e345de82799d1ec3c2bb8916e3803
    restart: unless-stopped
    command: centrifugo
    # Ключі (HMAC токенів, ключ API) і адреса рушія з паролем Redis — у centrifugo.env (`edge-secret --generate`).
    env_file: centrifugo.env
    # Конфігурація класу rehearsal: `pnpm --dir server realtime:config --print-env rehearsal` (рядок у рядок;
    # перевіряє infra/ops/test/compose.test.mjs). Клієнтський порт 8000 — лише для cloudflared (мережа realtime);
    # HTTP API і health — внутрішній порт 9000 (сервер через backend, з ключем).
    environment:
      CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"chat","allow_subscribe_for_anonymous":true,"allow_subscribe_for_client":true,"force_recovery":true,"history_size":100,"history_ttl":"300s"},{"name":"live","allow_subscribe_for_anonymous":true,"allow_subscribe_for_client":true,"force_recovery":true,"history_size":10,"history_ttl":"300s","presence":true},{"name":"notif","allow_user_limited_channels":true,"force_recovery":true,"history_meta_ttl":"3600s","history_size":20,"history_ttl":"600s"},{"name":"orders","allow_user_limited_channels":true,"force_recovery":true,"history_meta_ttl":"3600s","history_size":20,"history_ttl":"600s"},{"name":"site","allow_subscribe_for_anonymous":true,"allow_subscribe_for_client":true,"force_recovery":true,"history_size":10,"history_ttl":"300s"},{"name":"user","allow_user_limited_channels":true,"force_recovery":true,"history_meta_ttl":"3600s","history_size":20,"history_ttl":"600s"}]'
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_ALLOW_SUBSCRIBE_FOR_ANONYMOUS: 'true'
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_ALLOW_SUBSCRIBE_FOR_CLIENT: 'true'
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_FORCE_RECOVERY: 'true'
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_SIZE: '20'
      CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_TTL: '300s'
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: 'https://rehearsal.time2fest.com'
      CENTRIFUGO_CLIENT_ALLOW_ANONYMOUS_CONNECT_WITHOUT_TOKEN: 'true'
      CENTRIFUGO_CLIENT_DISALLOW_ANONYMOUS_CONNECTION_TOKENS: 'true'
      CENTRIFUGO_CLIENT_PING_INTERVAL: '25s'
      CENTRIFUGO_HEALTH_ENABLED: 'true'
      CENTRIFUGO_HTTP_SERVER_INTERNAL_PORT: '9000'
      CENTRIFUGO_ENGINE_TYPE: 'redis'
      CENTRIFUGO_ENGINE_REDIS_PREFIX: 't2f_centrifugo'
      CENTRIFUGO_ADMIN_ENABLED: 'false'
      # М'яка межа купи Go нижче за mem_limit: GC працює активніше, ніж OOM.
      GOMEMLIMIT: '200MiB'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    mem_limit: 256m
    networks:
      - backend
      - realtime

  server:
    image: t2f-server:${T2F_SERVER_SHA:?set by ops}
    restart: unless-stopped
    env_file: server.env
    environment:
      T2F_ENV: ${T2F_ENV:?set by ops}
      T2F_HOST: 0.0.0.0
      T2F_SERVER_PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/health-probe.mjs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1536m
    networks:
      - backend
      - tunnel
      - egress

  cloudflared:
    # cloudflare/cloudflared (той самий дайджест, що в infra/cloudflare)
    image: cloudflare/cloudflared@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: cloudflared.env
    mem_limit: 128m
    # Не в backend (S1): лише `tunnel` до сервера, `realtime` до Centrifugo і власний вихід назовні до Cloudflare.
    networks:
      - tunnel
      - realtime
      - tunnel-egress

# backend — лише postgres, redis, centrifugo, server; tunnel — лише server і cloudflared (перехід тунель → сервер);
# realtime — лише centrifugo і cloudflared (тунель → клієнтський порт 8000; ingress не веде на 9000, API — з ключем);
# egress — вихід сервера назовні, tunnel-egress — вихід cloudflared до Cloudflare.
networks:
  backend:
    internal: true
  tunnel:
    internal: true
  realtime:
    internal: true
  egress: {}
  tunnel-egress: {}

volumes:
  pgdata: {}
