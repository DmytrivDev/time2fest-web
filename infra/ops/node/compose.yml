# Вузол репетиції: Postgres + Redis + сервер + cloudflared (SPEC-13a, W10).
# Без `name:` — проєкт задає `-p` (t2f-node-<env>). Без `ports:` — Docker
# обходить ufw, тому назовні нічого не публікується; вхід лише через тунель.
# Файли `server.env`, `postgres.env`, `cloudflared.env` лежать поруч на вузлі.
# REDIS_URL, T2F_REDIS_PREFIX, DATABASE_URI, POSTGRES_USER, POSTGRES_DB пише
# `edge-secret --generate` у env-файли; T2F_COMMIT запечено в образ.
services:
  postgres:
    # postgres:17.12-alpine (індексний дайджест, linux/amd64 + arm64)
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    env_file: postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    networks:
      - backend

  redis:
    # redis:7.4.12-alpine (індексний дайджест, linux/amd64 + arm64)
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    networks:
      - backend

  server:
    image: t2f-server:${T2F_SERVER_SHA:?set by ops}
    restart: unless-stopped
    env_file: server.env
    environment:
      T2F_ENV: ${T2F_ENV:?set by ops}
      T2F_HOST: 0.0.0.0
      T2F_SERVER_PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/health-probe.mjs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1536m
    networks:
      - backend
      - egress

  cloudflared:
    # cloudflare/cloudflared (той самий дайджест, що в infra/cloudflare)
    image: cloudflare/cloudflared@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: cloudflared.env
    mem_limit: 128m
    networks:
      - backend
      - egress

networks:
  backend:
    internal: true
  egress: {}

volumes:
  pgdata: {}
