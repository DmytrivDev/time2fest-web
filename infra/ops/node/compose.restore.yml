# Чистий стек відновлення копії (SPEC-13b W44, AC-53 … AC-59): `pnpm restore:env -- --env rehearsal --from <ключ|latest>
# --target local`. Лише на машині оператора, лише власний проєкт Compose `t2f-restore-<UTC-штамп>`, створений цим
# запуском (`-p t2f` і томи інших проєктів не чіпаються ніколи); після звіту — `down -v` саме цього проєкту.
#   docker compose -p t2f-restore-<штамп> -f compose.restore.yml up -d --wait postgres redis
#   docker compose -p … -f compose.restore.yml --profile pull run --rm --no-deps -e T2F_R2_… -e T2F_BACKUP_KEY pull \
#     pnpm run ops restore-pull --key <ключ>
#   docker compose -p … -f compose.restore.yml up -d --wait server
# Змінні інтерполяції задає ops лише середовищем процесу `docker compose` (не argv): образ коміту маніфесту, випадкові
# пароль бази й PAYLOAD_SECRET цього запуску, тека тимчасових файлів на хості. Ключ копії й ключі R2 джерела отримує
# лише одноразовий `pull` (`-e NAME` без значення). Сервер — клас `test`: жодних ключів R2, Telegram, копій. Портів
# назовні немає; `backend` — внутрішня мережа без виходу; вихід (`egress`) — лише у `pull`, якому треба R2.
# Клас `test` приймає лише loopback-базу й Redis (ізоляція, `testIsolationFailures`), тож `redis` і `server` ділять
# мережевий простір `postgres` (`network_mode: service:postgres`): для сервера обидва — на 127.0.0.1 (W46).
services:
  postgres:
    # postgres:17.12-alpine (індексний дайджест, linux/amd64 + arm64) — той самий, що на вузлі (compose.yml)
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: "no"
    environment:
      POSTGRES_USER: t2f
      POSTGRES_DB: t2f_restore
      POSTGRES_PASSWORD: ${T2F_RESTORE_PG_PASSWORD:?set by ops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t2f -d t2f_restore"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - backend

  redis:
    # redis:7.4.12-alpine (індексний дайджест, linux/amd64 + arm64) — той самий, що на вузлі; без збереження на диск
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: "no"
    command: ["redis-server", "--bind", "127.0.0.1", "--save", "", "--appendonly", "no"]
    network_mode: "service:postgres"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    image: t2f-server:${T2F_SERVER_SHA:?set by ops}
    restart: "no"
    environment: &server-env
      T2F_ENV: test
      DATABASE_URI: postgres://t2f:${T2F_RESTORE_PG_PASSWORD:?set by ops}@127.0.0.1:5432/t2f_restore
      REDIS_URL: redis://127.0.0.1:6379/0
      T2F_REDIS_PREFIX: "t2f:restore:"
      PAYLOAD_SECRET: ${T2F_RESTORE_PAYLOAD_SECRET:?set by ops}
      T2F_HOST: 0.0.0.0
      T2F_SERVER_PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/health-probe.mjs"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    network_mode: "service:postgres"

  # Одноразове завантаження й відновлення копії (`ops restore-pull`): розшифрований потік іде лише в `pg_restore`,
  # завантажений шифрований файл — лише в теку `/restore-tmp` (тека цілі на хості, прибирається ops).
  pull:
    profiles: ["pull"]
    image: t2f-server:${T2F_SERVER_SHA:?set by ops}
    restart: "no"
    environment:
      <<: *server-env
      # `pull` — у мережах `backend` і `egress` (йому потрібен R2), тож база — за іменем сервісу; `restore-pull` не
      # вимагає loopback (лише не-production і порожню ціль).
      DATABASE_URI: postgres://t2f:${T2F_RESTORE_PG_PASSWORD:?set by ops}@postgres:5432/t2f_restore
      T2F_RESTORE_TMP: /restore-tmp
    volumes:
      - ${T2F_RESTORE_TMP_HOST:?set by ops}:/restore-tmp
    # Loopback-джерело (локальний емулятор R2): переходник ops веде 127.0.0.1:<порт> контейнера сюди.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - egress

networks:
  backend:
    internal: true
  egress: {}

volumes:
  pgdata: {}
