# Другий вузол репетиції (O·P18a, навчання «два сервери»): лише `server`, той самий образ, що працює на основному.
# На вузлі цей файл лежить як compose.yml у /srv/t2f/<env>-server2 (проєкт `t2f-<env>-server2`; привозить
# `ops server2 up`). Без cloudflared і без `ports:` — публічного входу немає, тунель і Worker лишаються на основному.
# server.env — похідний від server.env основного: DATABASE_URI, REDIS_URL, T2F_CENTRIFUGO_URL ведуть на приватну адресу
# основного вузла (міняються лише хости; `ops server2 up` пише .local/<env>/server2.env). Міграцій тут не буває.
services:
  server:
    image: t2f-server:${T2F_SERVER_SHA:?set by ops}
    restart: unless-stopped
    env_file: server.env
    environment:
      T2F_ENV: ${T2F_ENV:?set by ops}
      T2F_HOST: 0.0.0.0
      T2F_SERVER_PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "scripts/health-probe.mjs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1536m
    networks:
      - egress

# egress — вихід сервера: до приватної адреси основного вузла (Postgres, Redis) і назовні (R2, Cloudflare Access).
networks:
  egress: {}
