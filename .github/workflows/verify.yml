# `web full`, `contracts full`, `rules full`, `edge full`, `infra full`, and the server steps (= `server.full` split in two)
# mirror `.claude/sdd-engineering.json`. Change them together.
name: verify

on: push

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # GitHub cannot pass `--databases`, so CI uses slot 0 (Redis DB 0 of 16, enough).
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: t2f
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U t2f" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4.12-alpine
        ports: ['6380:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    steps:
      # `runner` context is not available in job-level `env`, so set it in a step.
      - name: Lock dir
        run: echo "T2F_LOCK_DIR=$RUNNER_TEMP/t2f-locks" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@12.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: web full
        run: npx tsc --noEmit -p . && node scripts/contract-surface.mjs --check && npx eslint . && npx vitest run --maxWorkers=2 && node scripts/sync_tokens.mjs --check && npx cross-env NEXT_DIST_DIR=out-verify next build
      - name: contracts full
        working-directory: packages/contracts
        run: npx tsc --noEmit -p . && npx vitest run --maxWorkers=2 && node ../../scripts/contract-surface.mjs --check
      - name: rules full
        working-directory: packages/rules
        run: npx tsc --noEmit -p . && node ../../node_modules/vitest/vitest.mjs run --maxWorkers=2
      - name: edge full
        working-directory: workers/edge
        run: node ../../node_modules/typescript/bin/tsc --noEmit -p . && node ../../node_modules/typescript/bin/tsc --noEmit -p tsconfig.test.json && node ../../node_modules/vitest/vitest.mjs run --maxWorkers=2
      - name: infra full
        working-directory: infra/cloudflare
        run: node ../../node_modules/typescript/bin/tsc --noEmit -p . && node ../../node_modules/vitest/vitest.mjs run --maxWorkers=2
      - name: secret check
        run: node scripts/check-secrets.mjs
      - name: research_data path check
        run: node scripts/check-research-data.mjs
      - name: contract suites (sim)
        run: pnpm contracts:run --sim-only
      - name: server unit
        working-directory: server
        run: npx tsc --noEmit -p . && npx eslint . && npx vitest run --maxWorkers=2
      - name: server integration
        working-directory: server
        run: node scripts/db.mjs create && node scripts/db.mjs env && pnpm migrate && pnpm test:int && node scripts/verify-schema.mjs
